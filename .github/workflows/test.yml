name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
        working-directory: go
      - run: test -z "$(gofmt -l .)"
        working-directory: go
      - run: go test ./...
        working-directory: go
