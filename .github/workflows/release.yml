name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Test
        run: cd go && go vet ./... && go test ./...

      - name: Build release packages (darwin/linux x amd64/arm64 tar.gz + checksums)
        run: cd go && VERSION=${GITHUB_REF_NAME} ./build.sh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: go/dist/${{ github.ref_name }}/frza_${{ github.ref_name }}_*.tar.gz
          generate_release_notes: true
